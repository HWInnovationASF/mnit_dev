<div class="mon-panel">
    <div class="mon-panel-header">
        <div class="mon-quicklinks">
            <a href="/debug/M1" class="btn btn-outline-primary btn-sm">M1</a>
            <a href="/debug/S1" class="btn btn-outline-primary btn-sm">S1</a>
            <a href="/debug/RL" class="btn btn-outline-primary btn-sm">RL</a>
            <a href="/debug/SI" class="btn btn-outline-primary btn-sm">SI</a>
            <a href="/debug/IR" class="btn btn-outline-primary btn-sm">IR</a>
            <a href="/debug/ALL" class="btn btn-primary btn-sm">ALL</a>
        </div>
        <div class="mon-quicklinks">
            <button class="btn btn-warning btn-sm" onclick="subscribeTopic('meow/#')"><i class="fa-solid fa-play"></i> Debug</button>
            <button class="btn btn-outline-danger btn-sm" onclick="unsubscribeTopic('meow/#')"><i class="fa-solid fa-stop"></i> Stop</button>
            <input type="text" class="form-control form-control-sm" name="searchInput" id="searchInput" onkeyup="filterTable()" placeholder="Search device..." style="width:200px;">
        </div>
    </div>
    <div class="mon-panel-body">
        <div id="deviceList">
            {% for data_k in data.data_arr %}
            {% if data_k.device_SN%}
            <div class="mon-device-row" data-search="{{ data_k.device_SN }} {{ data_k.ProjectName }} {{ data_k.Name }}">
                <div class="mon-device-main">
                    <div class="status-dev-{{ data_k.device_SN }} mon-device-dot"></div>
                    <div class="mon-device-info">
                        <div class="mon-device-sn">{{ data_k.device_SN }}</div>
                        <div class="mon-device-sub">{{ data_k.Name or '-' }} &middot; {{ data_k.ProjectName or '-' }}</div>
                    </div>
                </div>
                <div class="mon-device-actions">
                    <button class="btn btn-sm btn-outline-secondary" onclick="toggleData(this)">Data</button>
                    <a class="btn btn-sm btn-primary" href="/mqtt?device_sn={{ data_k.device_SN }}">MQTT</a>
                    <a class="btn btn-sm btn-primary" href="/dashboard?device_sn={{ data_k.device_SN }}">Dashboard</a>
                    <a class="btn btn-sm btn-primary" href="/config?device_sn={{ data_k.device_SN }}">Config</a>
                </div>
            </div>
            <div class="mon-device-data" style="display:none;">
                <textarea class="form-control" readonly>{{ data_k.WSData }}</textarea>
            </div>
            {% endif  %}
            {% endfor  %}

            {% if not data.data_arr %}
            <div class="mon-empty">
                <i class="fa-solid fa-satellite-dish"></i>
                <p>No devices found</p>
            </div>
            {% endif %}
        </div>
    </div>
</div>

<script>
    let socket = io();

    function subscribeTopic(topic) {
        console.log(topic);
        socket.emit('subscribe', { topic });
    }
    function unsubscribeTopic(topic) {
        console.log(topic);
        socket.emit('unsubscribe', { topic });
    }

    function toggleData(btn){
        let dataDiv = btn.closest('.mon-device-row').nextElementSibling;
        dataDiv.style.display = dataDiv.style.display === 'none' ? 'block' : 'none';
    }

    function filterTable() {
        const filter = document.getElementById("searchInput").value.toLowerCase();
        document.querySelectorAll('.mon-device-row').forEach(function(row){
            let match = row.getAttribute('data-search').toLowerCase().includes(filter);
            row.style.display = match ? '' : 'none';
            row.nextElementSibling.style.display = match ? row.nextElementSibling.style.display : 'none';
        });
    }

    socket.on('mqtt_message', data => {
        let msg_arr = JSON.parse(data.message);
        let device_SN = msg_arr.device_SN
        console.log(device_SN);

        const status_dev = document.querySelector(".status-dev-"+device_SN);
        if(status_dev){
            status_dev.classList.add('mon-device-dot-online');
        }
    });
</script>

<style>
    .mon-quicklinks{
        display:flex;
        align-items:center;
        gap:6px;
        flex-wrap:wrap;
    }
    .mon-device-row{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:14px;
        flex-wrap:wrap;
        padding:12px 6px;
        border-bottom:1px solid #eef1f6;
    }
    .mon-device-row:hover{
        background:#f8f9fc;
    }
    .mon-device-main{
        display:flex;
        align-items:center;
        gap:12px;
        min-width:220px;
    }
    .mon-device-dot{
        width:12px;
        height:12px;
        border-radius:50%;
        background:#d9dee8;
        flex:0 0 auto;
    }
    .mon-device-dot-online{
        background:#1aab63;
    }
    .mon-device-sn{
        font-weight:700;
        color:#1a2b4c;
    }
    .mon-device-sub{
        font-size:0.82rem;
        color:#6b7a99;
    }
    .mon-device-actions{
        display:flex;
        align-items:center;
        gap:6px;
        flex-wrap:wrap;
    }
    .mon-device-data{
        padding:0 6px 12px 38px;
        border-bottom:1px solid #eef1f6;
    }
    .mon-device-data textarea{
        width:100%;
        height:60px;
        font-size:0.82rem;
        background:#f8f9fc;
    }
    .mon-empty{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        color:#9aa7c2;
        padding:40px 0;
    }
    .mon-empty i{
        font-size:2.4rem;
        margin-bottom:10px;
    }
</style>
