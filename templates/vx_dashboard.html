<div style="padding: 15px;">
    <div>Device S/N : {{device_sn}}</div>

    <div id="settingsPanel" class="mon-settings-panel">
        <div class="mon-settings-title">
            <i class="fa-solid fa-gear"></i> เลือกค่าที่ต้องการดู real-time (ตั้งค่าก่อนกด Start)
        </div>
        <div class="mon-settings-options">
            <div class="form-check">
                <input class="form-check-input metric-toggle" type="checkbox" value="1" id="metric-PM210001" checked>
                <label class="form-check-label" for="metric-PM210001">Power Meter Main(p_t)</label>
            </div>
            <div class="form-check">
                <input class="form-check-input metric-toggle" type="checkbox" value="1" id="metric-IN130001" checked>
                <label class="form-check-label" for="metric-IN130001">BESS (SoC)</label>
            </div>
        </div>
    </div>
    <button
        onclick='sendCMD("meow/{{ device_sn }}", "{\"mode\":\"cmd\",\"data\":{\"IN130001\":{\"batt_temp_avg\":{\"write\":-500}}},\"cmd_id\":\"C1728370820091\"}")'>
        charge 50kW
    </button>
    <button
        onclick='sendCMD("meow/{{ device_sn }}", "{\"mode\":\"cmd\",\"data\":{\"IN130001\":{\"batt_temp_avg\":{\"write\":500}}},\"cmd_id\":\"C1728370820091\"}")'>
        discharge 50kW
    </button>
    <button
        onclick='sendCMD("meow/{{ device_sn }}", "{\"mode\":\"cmd\",\"data\":{\"IN130001\":{\"batt_temp_avg\":{\"write\":0}}},\"cmd_id\":\"C1728370820091\"}")'>
        OFF
    </button>

    <button class="btn btn-outline-secondary btn-sm" id="settingsBtn" type="button"><i class="fa-solid fa-gear"></i> Settings</button>
    <button class="btn btn-primary" id="startBtn">Start</button>

    <div id="container" style="width:80%; height:400px;"></div>
</div>

    // function toggleContent(element) {

    //     if (content) {
    //         content.style.display = (content.style.display === 'none' || content.style.display === '') ? 'block' : 'none';
    //     }
    // }
    let intervalId = null;

    // Metric config: which sub-device field to request/plot, and its label.
    // Add an entry here (+ a matching checkbox in the settings panel) to expose a new value.
    const METRICS = [
        { id: 'PM210001', field: 'p_t',   label: 'Power Meter (p_t)' },
        { id: 'IN130001', field: 'soc', label: 'BESS (SoC)' }
    ];

    function getSelectedMetrics() {
        return METRICS.filter(function(m){
            const cb = document.getElementById('metric-' + m.id);
            return cb && cb.checked;
        });
    }

    function setSettingsLocked(locked) {
        document.querySelectorAll('.metric-toggle').forEach(function(cb){ cb.disabled = locked; });
    }

    document.getElementById("settingsBtn").addEventListener("click", function() {
        const panel = document.getElementById("settingsPanel");
        panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
    });

    document.getElementById("startBtn").addEventListener("click", function() {
        const button = this;

        if (intervalId === null) {
            const selected = getSelectedMetrics();
            if (selected.length === 0) {
                alert('กรุณาเลือกค่าที่ต้องการดู real-time ก่อนกด Start');
                document.getElementById("settingsPanel").style.display = 'block';
                return;
            }

            const cmdData = {};
            selected.forEach(function(m){
                cmdData[m.id] = {};
                cmdData[m.id][m.field] = { realtime: 1 };
            });
            const cmd = JSON.stringify({ mode: 'cmd', data: cmdData, cmd_id: 'C1728370820091' });

            subscribeTopic('res/{{ device_sn }}');
            setSettingsLocked(true);
            document.getElementById("settingsPanel").style.display = 'none';

            // Start the interval
            intervalId = setInterval(() => {
                testMSG("meow/{{ device_sn }}", cmd);
            }, 3000);

            button.textContent = "Stop";
            button.className = "btn btn-danger";

        } else {
            unsubscribeTopic('res/{{ device_sn }}')
            // Stop the interval
            clearInterval(intervalId);
            intervalId = null;
            setSettingsLocked(false);
            button.textContent = "Start";
            button.className = "btn btn-primary";
        }
    });
    
    function subscribeTopic(topic) {
        // e.preventDefault();
        // const topic = document.getElementById("subTopic").value;
        console.log(topic);
        
        socket.emit('subscribe', { topic });
    }

    function unsubscribeTopic(topic) {
        // e.preventDefault();
        // const topic = document.getElementById("subTopic").value;
        console.log(topic);
        
        socket.emit('unsubscribe', { topic });
    }

    function testMSG(topic,cmd) {
        // e.preventDefault();
        // const topic = document.getElementById("subTopic").value;
        console.log(topic,cmd);
        
        socket.emit('testMSG', { send_topic:topic,send_message:cmd });
    }


    // deviceId (e.g. "PM210001") -> chart.series index, kept stable across messages
    const seriesIndexByDevice = {};

    socket.on('mqtt_message', data => {
        let msg_arr = JSON.parse(data.message);
        let device_SN = msg_arr.device_SN;

        // Ignore messages from other devices (multiple dashboards can be open
        // at once; the server broadcasts every MQTT message to every client).
        if (device_SN !== device_sn) return;

        const selectedIds = getSelectedMetrics().map(function(m){ return m.id; });

        Object.entries(msg_arr.data).forEach(([deviceId, values]) => {
            const metric = METRICS.find(function(m){ return m.id === deviceId; });
            if (!metric || selectedIds.indexOf(deviceId) === -1) return;

            const raw = values[metric.field];
            if (raw === undefined || raw === null) return;
            const power = Number(raw);
            if (Number.isNaN(power)) return;

            const point = [(msg_arr.ts * 1000), power];

            if (seriesIndexByDevice[deviceId] === undefined) {
                chart.addSeries({ name: metric.label, data: [] });
                seriesIndexByDevice[deviceId] = chart.series.length - 1;
            }

            chart.series[seriesIndexByDevice[deviceId]].addPoint(point, true, false);
        });
    });

    function sendCMD(topic,cmd) {
        // e.preventDefault();
        // const topic = document.getElementById("subTopic").value;
        console.log(topic,cmd);
        
        socket.emit('sendCMD', { send_topic:topic,send_message:cmd });
    }
</script>
