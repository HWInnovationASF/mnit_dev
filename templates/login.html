<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MDBIoT | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
</head>

<body>
  <div class="login-page">
    <div class="login-shell">

      <div class="login-brand">
        <div class="login-brand-blob login-brand-blob-1"></div>
        <div class="login-brand-blob login-brand-blob-2"></div>
        <div class="login-brand-content">
          <img src="{{ url_for('static', filename='images/logos/cat.gif') }}" alt="" class="login-brand-logo">
          <h1>MDBIoT</h1>
          <p>Monitor and manage your devices in one place.</p>
        </div>
      </div>

      <div class="login-panel">
        <div class="login-form-wrap">
          <h2 class="login-title">Welcome back</h2>
          <p class="login-subtitle">Sign in to continue to your dashboard</p>

          {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
          {% endif %}

          <form method="post" action="{{ url_for('login') }}" id="loginForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <div class="input-group login-input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group login-input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password">
                <span class="input-group-text toggle-login-password" role="button">
                  <i class="mdi mdi-eye-outline"></i>
                </span>
              </div>
            </div>

            <div class="d-flex align-items-center justify-content-end mb-4">
              <a class="login-link" href="javascript:void(0)" onclick="alert('กรุณาติดต่อผู้ดูแลระบบเพื่อรีเซ็ตรหัสผ่าน')">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 login-btn">
              <span>Sign In</span>
              <i class="fa-solid fa-arrow-right-long"></i>
            </button>

            <div class="login-signup">
              <span>Need an account? Contact your administrator.</span>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $('.toggle-login-password').click(function(){
      $(this).find('i').toggleClass('mdi-eye-outline mdi-eye-off-outline');
      let input = $(this).siblings('input');
      input.attr('type', input.attr('type') === 'password' ? 'text' : 'password');
    });
  </script>

  <style>
    body{
      margin:0;
    }
    .login-page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f2f5fb;
      padding:20px;
    }
    .login-shell{
      width:100%;
      max-width:960px;
      min-height:560px;
      display:flex;
      background:#fff;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 25px 60px -20px rgba(15, 42, 99, 0.35);
    }
    .login-brand{
      position:relative;
      flex:1 1 45%;
      background:linear-gradient(135deg, #064a99 0%, #1e4db7 55%, #3a7bd5 100%);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:40px;
    }
    .login-brand-content{
      position:relative;
      z-index:2;
      text-align:center;
    }
    .login-brand-logo{
      width:90px;
      height:90px;
      border-radius:50%;
      border:4px solid rgba(255,255,255,0.35);
      margin-bottom:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.25);
    }
    .login-brand-content h1{
      font-size:2.2rem;
      font-weight:800;
      margin-bottom:10px;
      letter-spacing:0.5px;
    }
    .login-brand-content p{
      font-size:1rem;
      opacity:0.85;
      max-width:280px;
      margin:0 auto;
    }
    .login-brand-blob{
      position:absolute;
      border-radius:50%;
      background:rgba(255,255,255,0.08);
    }
    .login-brand-blob-1{
      width:320px;
      height:320px;
      top:-120px;
      right:-100px;
    }
    .login-brand-blob-2{
      width:220px;
      height:220px;
      bottom:-90px;
      left:-70px;
      background:rgba(255,255,255,0.06);
    }
    .login-panel{
      flex:1 1 55%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 40px;
    }
    .login-form-wrap{
      width:100%;
      max-width:360px;
    }
    .login-title{
      font-weight:800;
      font-size:1.6rem;
      margin-bottom:4px;
      color:#1a2b4c;
    }
    .login-subtitle{
      color:#6b7a99;
      margin-bottom:28px;
      font-size:0.95rem;
    }
    .login-input-group .input-group-text{
      background:#f4f6fb;
      border-right:none;
      color:#6b7a99;
    }
    .login-input-group .form-control{
      border-left:none;
      padding-top:10px;
      padding-bottom:10px;
    }
    .login-input-group .form-control:focus{
      box-shadow:none;
      border-color:#c9d5ee;
    }
    .login-input-group .form-control:focus ~ .input-group-text,
    .login-input-group:focus-within .input-group-text{
      border-color:#c9d5ee;
    }
    .toggle-login-password{
      background:#f4f6fb;
      border-left:none;
      cursor:pointer;
    }
    .login-link{
      color:#1e4db7;
      font-weight:600;
      font-size:0.9rem;
      text-decoration:none;
    }
    .login-link:hover{
      text-decoration:underline;
    }
    .login-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:12px;
      font-weight:700;
      font-size:1.05rem;
      border-radius:12px;
      border:none;
      background:linear-gradient(135deg, #1e4db7, #3a7bd5);
      transition:transform 0.15s ease, box-shadow 0.15s ease;
    }
    .login-btn:hover{
      transform:translateY(-1px);
      box-shadow:0 12px 24px -8px rgba(30,77,183,0.55);
    }
    .login-signup{
      margin-top:22px;
      text-align:center;
      font-size:0.9rem;
      color:#6b7a99;
    }
    .login-signup a{
      color:#1e4db7;
      font-weight:700;
      text-decoration:none;
      margin-left:6px;
    }
    .login-signup a:hover{
      text-decoration:underline;
    }
    @media (max-width: 767px){
      .login-shell{
        flex-direction:column;
        min-height:auto;
        border-radius:16px;
      }
      .login-brand{
        padding:28px;
      }
      .login-brand-logo{
        width:64px;
        height:64px;
      }
      .login-brand-content h1{
        font-size:1.6rem;
      }
      .login-panel{
        padding:32px 24px;
      }
    }
  </style>
</body>

</html>
