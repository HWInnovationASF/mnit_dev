<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MDBIoT | Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>

    <div class="mon-layout" id="mon-layout">

        <aside class="mon-sidebar" id="mon-sidebar">
            <div class="mon-sidebar-brand">
                <img src="{{ url_for('static', filename='images/logos/cat.gif') }}" alt="" class="mon-sidebar-logo">
                <span class="mon-sidebar-title">MDBIoT</span>
            </div>
            <nav class="mon-sidebar-nav">
                <a href="/"><i class="fa-solid fa-gauge"></i> Home</a>
                <a href="/debug/M1" class="active"><i class="fa-solid fa-bug"></i> Debug</a>
                <a href="/dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <div class="mon-sidebar-collapse">
                    <a href="javascript:void(0)" class="mon-sidebar-collapse-toggle" onclick="toggleSidebarGroup(this)">
                        <i class="fa-solid fa-server"></i> Manage Device <i class="fa-solid fa-chevron-down mon-caret"></i>
                    </a>
                    <div class="mon-sidebar-submenu">
                        <a href="/config"><i class="fa-solid fa-sliders"></i> Config</a>
                    </div>
                </div>
                {% if session.get('logged_in') %}
                <a href="/logout" class="mon-sidebar-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout ({{ session.get('username') }})</a>
                {% endif %}
            </nav>
        </aside>

        <div class="mon-main">

            <header class="mon-topbar">
                <button class="mon-sidebar-toggle" id="mon-sidebar-toggle"><i class="fa-solid fa-bars"></i></button>
                <span class="mon-topbar-title">Debug</span>
                <span class="mon-topbar-time" id="stat-time">--:--:--</span>
            </header>

            <main class="mon-content">
                {% include 'index.html' %}
            </main>

            <footer class="mon-footer">
                <p>&copy; 2025 MDBIoT. All rights reserved.</p>
            </footer>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSidebarGroup(toggle){
            toggle.parentElement.classList.toggle('mon-sidebar-collapse-open');
        }

        function updateClock(){
            document.getElementById('stat-time').textContent = new Date().toLocaleTimeString();
        }
        updateClock();
        setInterval(updateClock, 1000);

        var monLayout = document.getElementById('mon-layout');
        if (window.innerWidth < 768) {
            monLayout.classList.add('mon-sidebar-closed');
        }
        document.getElementById('mon-sidebar-toggle').addEventListener('click', function(){
            monLayout.classList.toggle('mon-sidebar-closed');
        });
    </script>

    <style>
        *{ box-sizing:border-box; }
        body{
            margin:0;
            background:#f2f5fb;
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .mon-layout{
            display:flex;
            min-height:100vh;
        }

        /* Sidebar */
        .mon-sidebar{
            width:230px;
            flex:0 0 auto;
            background:linear-gradient(180deg, #064a99 0%, #1e4db7 55%, #3a7bd5 100%);
            color:#fff;
            display:flex;
            flex-direction:column;
            padding:22px 16px;
            overflow:hidden;
            transition:width 0.2s ease, padding 0.2s ease;
        }
        .mon-layout.mon-sidebar-closed .mon-sidebar{
            width:0;
            padding-left:0;
            padding-right:0;
        }
        .mon-sidebar-brand,
        .mon-sidebar-nav a{
            white-space:nowrap;
        }
        .mon-sidebar-brand{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:30px;
            padding:0 6px;
        }
        .mon-sidebar-logo{
            width:36px;
            height:36px;
            border-radius:50%;
            border:2px solid rgba(255,255,255,0.5);
        }
        .mon-sidebar-title{
            font-weight:800;
            font-size:1.15rem;
            letter-spacing:0.3px;
        }
        .mon-sidebar-nav{
            display:flex;
            flex-direction:column;
            gap:4px;
        }
        .mon-sidebar-nav a{
            display:flex;
            align-items:center;
            gap:10px;
            color:rgba(255,255,255,0.85);
            text-decoration:none;
            font-weight:600;
            font-size:0.92rem;
            padding:10px 12px;
            border-radius:10px;
        }
        .mon-sidebar-nav a i{
            width:18px;
            text-align:center;
        }
        .mon-sidebar-nav a:hover{
            background:rgba(255,255,255,0.12);
            color:#fff;
        }
        .mon-sidebar-nav a.active{
            background:rgba(255,255,255,0.18);
            color:#fff;
        }
        .mon-sidebar-nav a.mon-sidebar-logout{
            margin-top:auto;
        }
        .mon-sidebar-collapse-toggle{
            justify-content:space-between;
        }
        .mon-sidebar-collapse-toggle .mon-caret{
            font-size:0.7rem;
            color:rgba(255,255,255,0.6);
            margin-left:auto;
            transition:transform 0.15s ease;
        }
        .mon-sidebar-collapse-open .mon-sidebar-collapse-toggle .mon-caret{
            transform:rotate(180deg);
        }
        .mon-sidebar-submenu{
            display:none;
            flex-direction:column;
            gap:2px;
            padding-left:14px;
        }
        .mon-sidebar-collapse-open .mon-sidebar-submenu{
            display:flex;
        }
        .mon-sidebar-submenu a{
            display:flex;
            align-items:center;
            gap:10px;
            color:rgba(255,255,255,0.75);
            text-decoration:none;
            font-weight:600;
            font-size:0.88rem;
            padding:8px 12px;
            border-radius:10px;
        }
        .mon-sidebar-submenu a:hover{
            background:rgba(255,255,255,0.12);
            color:#fff;
        }

        /* Main area */
        .mon-main{
            flex:1 1 auto;
            display:flex;
            flex-direction:column;
            min-width:0;
        }
        .mon-topbar{
            display:flex;
            align-items:center;
            gap:14px;
            padding:16px 28px;
            background:#fff;
            border-bottom:1px solid #eef1f6;
        }
        .mon-sidebar-toggle{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border:none;
            background:none;
            font-size:1.2rem;
            color:#1a2b4c;
            cursor:pointer;
            padding:4px 6px;
        }
        .mon-topbar-title{
            font-weight:800;
            font-size:1.1rem;
            color:#1a2b4c;
        }
        .mon-topbar-time{
            margin-left:auto;
            color:#6b7a99;
            font-weight:600;
            font-size:0.9rem;
        }
        .mon-content{
            flex:1 1 auto;
            max-width:1300px;
            width:100%;
            margin:0 auto;
            padding:28px 20px 40px;
        }
        .mon-panel{
            background:#fff;
            border-radius:16px;
            box-shadow:0 10px 25px -15px rgba(15,42,99,0.25);
            overflow:hidden;
        }
        .mon-panel-header{
            padding:16px 22px;
            font-weight:800;
            color:#1a2b4c;
            border-bottom:1px solid #eef1f6;
            display:flex;
            align-items:center;
            justify-content:space-between;
            flex-wrap:wrap;
            gap:10px;
        }
        .mon-panel-body{
            padding:20px 22px;
        }
        .mon-footer{
            text-align:center;
            padding:18px;
            color:#9aa7c2;
            font-size:0.85rem;
        }

        @media (max-width: 767px){
            .mon-sidebar{
                position:fixed;
                left:0;
                top:0;
                bottom:0;
                z-index:1000;
                width:230px;
                padding:22px 16px;
                transform:translateX(0);
                transition:transform 0.2s ease;
                box-shadow:0 0 30px rgba(0,0,0,0.25);
            }
            .mon-layout.mon-sidebar-closed .mon-sidebar{
                width:230px;
                padding:22px 16px;
                transform:translateX(-100%);
            }
        }
    </style>
</body>
</html>
